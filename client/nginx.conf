server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite fingerprints these filenames by content hash, so they're safe to cache
    # forever — a rebuild always produces a new filename, never a stale one.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html references the current asset hashes, so it must always be
    # revalidated — otherwise a browser can serve a stale HTML shell (pointing at an
    # old JS bundle) without the user ever noticing a plain refresh didn't pick up
    # a new deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
