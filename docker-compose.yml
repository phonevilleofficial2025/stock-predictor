services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 4000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - server_data:/app/data
    ports:
      - "${SERVER_PORT:-4000}:4000"

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - server

volumes:
  server_data:
